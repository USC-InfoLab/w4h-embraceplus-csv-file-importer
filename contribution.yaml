# Test contract + live-run sample for this module.
# Automated tests and in-app Run / ./run.sh use the tiny synthetic Cloud-tree
# fixtures below. Do not copy real Empatica Cloud dumps into git.

slug: w4h-embraceplus-csv-file-importer
kind: ingest
publisher: usc-infolab

tests:
  automated:
    command: pytest tests/ -q -m "not integration"
    sample:
      kind: fixtures
      path: tests/fixtures

  live:
    command: ./run.sh import
    sample:
      kind: fixtures
      path: tests/fixtures

inputs:
  - key: dataset_id
    type: dataset
    create: empty
  - key: dataset_title
    type: text
    default: EmbracePlus file-importer test
    override: true
  # Select importer reads these fields. {dataset} is the catalog row name.
  - key: files
    type: files
    required: false
    summary: Empatica EmbracePlus Cloud dump (not the E4). Choose one zip for the whole site, one zip per participant (select them all at once), or the unzipped participant_data folder.
    note: Every participant and day loads into {dataset}. Pulse rate, EDA, temperature, and the other per-minute biomarkers each become one table. Avro files and reports are ignored. The command line is optional.
    drop_label: Drop zip files or a folder
    files_button: Choose zip files
    folder_button: Choose folder
    accept:
      - csv
      - zip
    include: aggregated_per_minute/
    detect:
      - participant_data/
      - aggregated_per_minute/
    ignored: Avro and reports are not loaded.
    empty: Drop the zip files, or choose the folder that contains the biomarker CSVs.
